name: purgebot

x-bot-service: &bot-service
  pull_policy: if_not_present
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    container_name: purgebot-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: purgebot-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Bot services ─────────────────────────────────────────────────────────────

  interactions:
    <<: *bot-service
    container_name: purgebot-interactions
    image: ${INTERACTIONS_IMAGE:-ghcr.io/purgebot-net/interactions:latest}
    ports:
      - "${INTERACTIONS_PORT:-8181}:8080"

  gateway:
    <<: *bot-service
    container_name: purgebot-gateway
    image: ${GATEWAY_IMAGE:-ghcr.io/purgebot-net/gateway:latest}

  purger:
    <<: *bot-service
    container_name: purgebot-purger
    image: ${PURGER_IMAGE:-ghcr.io/purgebot-net/purger:latest}

  sweeper:
    <<: *bot-service
    container_name: purgebot-sweeper
    image: ${SWEEPER_IMAGE:-ghcr.io/purgebot-net/sweeper:latest}

volumes:
  postgres_data:
  redis_data:
